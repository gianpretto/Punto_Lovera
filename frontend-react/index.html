<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subastas de fondos de comercio en vivo | Punto Lovera</title>
    <meta
      name="description"
      content="Punto Lovera: subastas online de fondos de comercio y equipamiento en Buenos Aires. Mirá el remate en vivo y ofertá desde tu casa."
    />
    <meta name="theme-color" content="#3e6d72" />

    <!-- Fuentes de Google (Akatab + Instrument Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Akatab:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!-- Vista previa al compartir el link (WhatsApp, Facebook, etc.).
         Si cambia el dominio, actualizar og:url y og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Punto Lovera" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Punto Lovera | Subastas de fondos de comercio en vivo" />
    <meta
      property="og:description"
      content="Mirá el remate en vivo y ofertá desde tu casa. Fondos de comercio y equipamiento en Buenos Aires."
    />
    <meta property="og:url" content="https://punto-lovera.vercel.app/" />
    <meta property="og:image" content="https://punto-lovera.vercel.app/assets/figma/hero-galpon.webp" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Pantalla de carga (como la de Facebook): el logo sobre el fondo claro
         hasta que la app arranca y sabe si hay sesión. La saca
         components/layout/PantallaCarga. Estilos inline para que se vea
         antes de que baje el CSS de la app. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8f9;
        transition: opacity 0.25s ease;
      }
      #splash.fuera {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 240px;
        max-width: 60vw;
        height: auto;
        animation: splash-latido 1.6s ease-in-out infinite;
      }
      @keyframes splash-latido {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
    <div id="splash" aria-hidden="true">
      <img src="/assets/figma/logo-oscuro.svg" alt="" width="217" height="22" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
